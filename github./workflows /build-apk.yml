# ساخت خودکار APK روی سرور GitHub (رایگان، بدون Android Studio)
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # دکمه اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#08080d' --splashBackgroundColor '#08080d'

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: notebook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
